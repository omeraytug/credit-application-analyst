[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "strands-agents[openai]>=1.37.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.45.0",
    "pandas<3",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/api"]
